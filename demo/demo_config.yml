# =============================================================================
# Demo Configuration — Dynamic Databricks Ingestion Framework
# =============================================================================
#
# SOURCE TYPE : volume  (Unity Catalog Volume — no S3 / no DBFS needed)
# VOLUME PATH : /Volumes/workspace/ingestion_metadata/demo_volume/data/
#
# WHEN YOU GET S3: change source_type → s3, add s3_bucket + s3_path
# =============================================================================

source_system: ecommerce
environment: dev

datasets:

  # ---------------------------------------------------------------------------
  # Dataset 1: Orders (TSV, full load)
  # ---------------------------------------------------------------------------
  - dataset_name: orders
    version: "1.0"
    dataset_type: transactional
    data_tier: bronze
    business_description: >
      Customer order transactions. Demo data — 30 rows from UC Volume TSV file.
    criticality: high
    classification: internal
    pii: false
    active: true

    # Source — Unity Catalog Volume (no S3/DBFS needed)
    source_type: volume
    volume_path: /Volumes/workspace/ingestion_metadata/demo_volume/data/orders
    file_pattern: "orders.tsv"

    format: tsv
    delimiter: "\t"
    encoding: UTF-8
    header: true

    ingestion_mode: batch
    load_type: full

    schema_location: /Volumes/workspace/ingestion_metadata/demo_volume/schemas/orders/
    checkpoint_location: /Volumes/workspace/ingestion_metadata/demo_volume/checkpoints/orders/

    primary_keys:
      - order_id
    watermark:
      column: order_timestamp
      delay: "2 hours"
    frequency: daily

    tags:
      domain: ecommerce
      owner: data-engineering-team
      retention_days: "365"
      sensitivity: standard
      demo: "true"

    data_quality:
      - rule_name: order_id_not_null
        rule_type: not_null
        column_name: order_id
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: order_amount_positive
        rule_type: range
        column_name: order_amount
        rule_expression: "order_amount > 0"
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: order_status_valid
        rule_type: regex
        column_name: order_status
        rule_expression: "^(PENDING|CONFIRMED|SHIPPED|DELIVERED|CANCELLED)$"
        threshold_pct: 100.0
        fail_on_breach: false

  # ---------------------------------------------------------------------------
  # Dataset 2: Customers (TSV, full load)
  # ---------------------------------------------------------------------------
  - dataset_name: customers
    version: "1.0"
    dataset_type: reference
    data_tier: bronze
    business_description: >
      Customer master data. Demo data — 10 rows from UC Volume TSV file.
    criticality: high
    classification: confidential
    pii: true
    active: true

    source_type: volume
    volume_path: /Volumes/workspace/ingestion_metadata/demo_volume/data/customers
    file_pattern: "customers.tsv"

    format: tsv
    delimiter: "\t"
    encoding: UTF-8
    header: true

    ingestion_mode: batch
    load_type: full

    schema_location: /Volumes/workspace/ingestion_metadata/demo_volume/schemas/customers/
    checkpoint_location: /Volumes/workspace/ingestion_metadata/demo_volume/checkpoints/customers/

    primary_keys:
      - customer_id
    watermark:
      column: registration_date
      delay: "0 hours"
    frequency: daily

    tags:
      domain: ecommerce
      owner: data-engineering-team
      retention_days: "730"
      sensitivity: pii
      pii_columns: "email,phone,date_of_birth"
      demo: "true"

    data_quality:
      - rule_name: customer_id_not_null
        rule_type: not_null
        column_name: customer_id
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: email_not_null
        rule_type: not_null
        column_name: email
        threshold_pct: 100.0
        fail_on_breach: true

  # ---------------------------------------------------------------------------
  # Dataset 3: Products (TSV, full load)
  # ---------------------------------------------------------------------------
  - dataset_name: products
    version: "1.0"
    dataset_type: reference
    data_tier: bronze
    business_description: >
      Product catalogue. Demo data — 10 rows from UC Volume TSV file.
    criticality: medium
    classification: internal
    pii: false
    active: true

    source_type: volume
    volume_path: /Volumes/workspace/ingestion_metadata/demo_volume/data/products
    file_pattern: "products.tsv"

    format: tsv
    delimiter: "\t"
    encoding: UTF-8
    header: true

    ingestion_mode: batch
    load_type: full

    schema_location: /Volumes/workspace/ingestion_metadata/demo_volume/schemas/products/
    checkpoint_location: /Volumes/workspace/ingestion_metadata/demo_volume/checkpoints/products/

    primary_keys:
      - product_id
    watermark:
      column: last_updated
      delay: "1 hour"
    frequency: daily

    tags:
      domain: ecommerce
      owner: product-team
      retention_days: "365"
      sensitivity: standard
      demo: "true"

    data_quality:
      - rule_name: product_id_not_null
        rule_type: not_null
        column_name: product_id
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: unit_price_positive
        rule_type: range
        column_name: unit_price
        rule_expression: "unit_price > 0"
        threshold_pct: 100.0
        fail_on_breach: true
