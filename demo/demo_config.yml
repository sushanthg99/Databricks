# =============================================================================
# Demo Configuration — Dynamic Databricks Ingestion Framework
# =============================================================================
#
# PURPOSE:
#   Demo mode configuration using DBFS (Databricks File System) as the source.
#   Use this when you don't have AWS S3 access yet.
#   TSV files are uploaded to DBFS by the demo notebook, then ingested into
#   Delta Bronze tables using the same framework pipeline as production.
#
# SOURCE TYPE: dbfs (no S3 / AWS credentials needed)
#
# ONCE YOU HAVE S3:
#   Copy these datasets into configs/domain_config.yml and change:
#     source_type: s3
#     s3_bucket: your-bucket-name
#     s3_path: raw/ecommerce/{dataset_name}/
#   Remove source_type and dbfs_path fields.
#
# LOADED BY: demo/notebooks/demo_end_to_end.py
# =============================================================================

source_system: ecommerce
environment: dev

datasets:

  # ---------------------------------------------------------------------------
  # Dataset 1: Orders (TSV, full load)
  # 30 rows — order transactions across 10 customers and 10 products
  # ---------------------------------------------------------------------------
  - dataset_name: orders
    version: "1.0"
    dataset_type: transactional
    data_tier: bronze
    business_description: >
      Customer order transactions from the ecommerce platform.
      Demo data — 30 sample orders loaded from DBFS TSV file.
    criticality: high
    classification: internal
    pii: false
    active: true

    # Source — DBFS (demo mode, no S3 needed)
    source_type: dbfs
    dbfs_path: FileStore/demo/ecommerce/orders
    file_pattern: "orders.tsv"

    # File format
    format: tsv
    delimiter: "\t"
    encoding: UTF-8
    header: true

    # Ingestion settings
    ingestion_mode: batch
    load_type: full

    # Auto Loader schema + checkpoint volumes (used if switching to incremental)
    schema_location: /Volumes/workspace/demo_bronze/autoloader_volume/schemas/orders/
    checkpoint_location: /Volumes/workspace/demo_bronze/autoloader_volume/checkpoints/orders/

    # Primary key for Silver MERGE (future)
    primary_keys:
      - order_id

    # Watermark for incremental Silver (future)
    watermark:
      column: order_timestamp
      delay: "2 hours"

    frequency: daily

    # Tags
    tags:
      domain: ecommerce
      owner: data-engineering-team
      retention_days: "365"
      sensitivity: standard
      demo: "true"

    # Data Quality rules
    data_quality:
      - rule_name: order_id_not_null
        rule_type: not_null
        column_name: order_id
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: order_amount_positive
        rule_type: range
        column_name: order_amount
        rule_expression: "order_amount > 0"
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: order_status_valid
        rule_type: regex
        column_name: order_status
        rule_expression: "^(PENDING|CONFIRMED|SHIPPED|DELIVERED|CANCELLED)$"
        threshold_pct: 100.0
        fail_on_breach: false

  # ---------------------------------------------------------------------------
  # Dataset 2: Customers (TSV, full load)
  # 10 rows — customer master data including loyalty tier and lifetime value
  # ---------------------------------------------------------------------------
  - dataset_name: customers
    version: "1.0"
    dataset_type: reference
    data_tier: bronze
    business_description: >
      Customer master data — name, contact, city, loyalty tier, lifetime value.
      Demo data — 10 sample customers loaded from DBFS TSV file.
    criticality: high
    classification: confidential
    pii: true
    active: true

    # Source — DBFS (demo mode)
    source_type: dbfs
    dbfs_path: FileStore/demo/ecommerce/customers
    file_pattern: "customers.tsv"

    # File format
    format: tsv
    delimiter: "\t"
    encoding: UTF-8
    header: true

    # Ingestion settings
    ingestion_mode: batch
    load_type: full

    # Auto Loader locations
    schema_location: /Volumes/workspace/demo_bronze/autoloader_volume/schemas/customers/
    checkpoint_location: /Volumes/workspace/demo_bronze/autoloader_volume/checkpoints/customers/

    primary_keys:
      - customer_id

    watermark:
      column: registration_date
      delay: "0 hours"

    frequency: daily

    tags:
      domain: ecommerce
      owner: data-engineering-team
      retention_days: "730"
      sensitivity: pii
      pii_columns: "email,phone,date_of_birth"
      demo: "true"

    data_quality:
      - rule_name: customer_id_not_null
        rule_type: not_null
        column_name: customer_id
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: email_not_null
        rule_type: not_null
        column_name: email
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: loyalty_tier_valid
        rule_type: regex
        column_name: loyalty_tier
        rule_expression: "^(BRONZE|SILVER|GOLD|PLATINUM)$"
        threshold_pct: 100.0
        fail_on_breach: false

  # ---------------------------------------------------------------------------
  # Dataset 3: Products (TSV, full load)
  # 10 rows — product catalogue with pricing, stock and supplier info
  # ---------------------------------------------------------------------------
  - dataset_name: products
    version: "1.0"
    dataset_type: reference
    data_tier: bronze
    business_description: >
      Product catalogue — name, category, brand, pricing, stock levels.
      Demo data — 10 sample products loaded from DBFS TSV file.
    criticality: medium
    classification: internal
    pii: false
    active: true

    # Source — DBFS (demo mode)
    source_type: dbfs
    dbfs_path: FileStore/demo/ecommerce/products
    file_pattern: "products.tsv"

    # File format
    format: tsv
    delimiter: "\t"
    encoding: UTF-8
    header: true

    # Ingestion settings
    ingestion_mode: batch
    load_type: full

    # Auto Loader locations
    schema_location: /Volumes/workspace/demo_bronze/autoloader_volume/schemas/products/
    checkpoint_location: /Volumes/workspace/demo_bronze/autoloader_volume/checkpoints/products/

    primary_keys:
      - product_id

    watermark:
      column: last_updated
      delay: "1 hour"

    frequency: daily

    tags:
      domain: ecommerce
      owner: product-team
      retention_days: "365"
      sensitivity: standard
      demo: "true"

    data_quality:
      - rule_name: product_id_not_null
        rule_type: not_null
        column_name: product_id
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: unit_price_positive
        rule_type: range
        column_name: unit_price
        rule_expression: "unit_price > 0"
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: stock_non_negative
        rule_type: range
        column_name: stock_quantity
        rule_expression: "stock_quantity >= 0"
        threshold_pct: 100.0
        fail_on_breach: false
