# =============================================================================
# DEMO Configuration — Dynamic Databricks Ingestion Framework
# =============================================================================
#
# PURPOSE:
#   End-to-end demo configuration using Databricks DBFS instead of AWS S3.
#   No cloud credentials needed. Files are uploaded to DBFS before running.
#
# DATA FILES (TSV format, tab-separated):
#   demo/data/orders.tsv    → 20 rows of ecommerce orders
#   demo/data/customers.tsv → 16 rows of customer master data
#   demo/data/products.tsv  → 8 rows of product catalogue
#
# DBFS SOURCE PATHS (after upload by demo notebook):
#   dbfs:/FileStore/demo/ecommerce/orders/
#   dbfs:/FileStore/demo/ecommerce/customers/
#   dbfs:/FileStore/demo/ecommerce/products/
#
# TARGET DELTA TABLES (written by ingestion engine):
#   hive_metastore.ecommerce_bronze.orders
#   hive_metastore.ecommerce_bronze.customers
#   hive_metastore.ecommerce_bronze.products
# =============================================================================

source_system: ecommerce
environment:   demo

datasets:

  # ---------------------------------------------------------------------------
  # Dataset 1: Orders — TSV, incremental via Auto Loader
  # ---------------------------------------------------------------------------
  - dataset_name: orders
    version: "1.0"
    dataset_type: transactional
    data_tier: bronze
    business_description: >
      Customer order transactions from the ecommerce platform.
      Contains order ID, customer ID, product, status, amount, and shipping info.
    criticality: high
    classification: internal
    pii: false
    active: true

    # Source file settings
    file_pattern: "orders.tsv"
    frequency: daily

    # Ingestion settings
    ingestion_mode: auto_loader
    load_type: incremental

    # DBFS source path (no S3 bucket needed for demo)
    source_type: dbfs
    dbfs_path: /FileStore/demo/ecommerce/orders/

    # File format — TSV is CSV with tab delimiter
    format: csv
    delimiter: "\t"
    encoding: UTF-8
    header: true

    # DBFS checkpoint and schema locations
    checkpoint_location: /tmp/demo/checkpoints/orders/
    schema_location:     /tmp/demo/schemas/orders/

    # Primary key for Silver MERGE / deduplication
    primary_keys:
      - order_id

    watermark:
      column: order_date
      delay: "1 hour"

    # Target Delta table
    target_table: hive_metastore.ecommerce_bronze.orders

    tags:
      domain: ecommerce
      owner: data-engineering-demo
      sensitivity: standard

    data_quality:
      - rule_name: order_id_not_null
        rule_type: not_null
        column_name: order_id
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: order_amount_positive
        rule_type: range
        column_name: order_amount
        rule_expression: "order_amount > 0"
        threshold_pct: 99.0
        fail_on_breach: false

      - rule_name: order_status_valid
        rule_type: regex
        column_name: order_status
        rule_expression: "^(PENDING|CONFIRMED|SHIPPED|DELIVERED|CANCELLED)$"
        threshold_pct: 100.0
        fail_on_breach: false

  # ---------------------------------------------------------------------------
  # Dataset 2: Customers — TSV, full load (batch overwrite)
  # ---------------------------------------------------------------------------
  - dataset_name: customers
    version: "1.0"
    dataset_type: reference
    data_tier: bronze
    business_description: >
      Customer master data including contact details, loyalty tier,
      and account statistics. Full snapshot delivered daily.
    criticality: high
    classification: confidential
    pii: true
    active: true

    file_pattern: "customers.tsv"
    frequency: daily

    ingestion_mode: batch
    load_type: full

    source_type: dbfs
    dbfs_path: /FileStore/demo/ecommerce/customers/

    format: csv
    delimiter: "\t"
    encoding: UTF-8
    header: true

    checkpoint_location: /tmp/demo/checkpoints/customers/
    schema_location:     /tmp/demo/schemas/customers/

    primary_keys:
      - customer_id

    watermark:
      column: signup_date
      delay: "0 hours"

    target_table: hive_metastore.ecommerce_bronze.customers

    tags:
      domain: ecommerce
      owner: data-engineering-demo
      sensitivity: pii
      pii_columns: "email,phone"

    data_quality:
      - rule_name: customer_id_not_null
        rule_type: not_null
        column_name: customer_id
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: email_not_null
        rule_type: not_null
        column_name: email
        threshold_pct: 95.0
        fail_on_breach: false

  # ---------------------------------------------------------------------------
  # Dataset 3: Products — TSV, full load
  # ---------------------------------------------------------------------------
  - dataset_name: products
    version: "1.0"
    dataset_type: reference
    data_tier: bronze
    business_description: >
      Product catalogue with SKUs, pricing, stock levels, and supplier info.
    criticality: medium
    classification: internal
    pii: false
    active: true

    file_pattern: "products.tsv"
    frequency: daily

    ingestion_mode: batch
    load_type: full

    source_type: dbfs
    dbfs_path: /FileStore/demo/ecommerce/products/

    format: csv
    delimiter: "\t"
    encoding: UTF-8
    header: true

    checkpoint_location: /tmp/demo/checkpoints/products/
    schema_location:     /tmp/demo/schemas/products/

    primary_keys:
      - product_id

    watermark:
      column: created_date
      delay: "0 hours"

    target_table: hive_metastore.ecommerce_bronze.products

    tags:
      domain: ecommerce
      owner: data-engineering-demo
      sensitivity: standard

    data_quality:
      - rule_name: product_id_not_null
        rule_type: not_null
        column_name: product_id
        threshold_pct: 100.0
        fail_on_breach: true

      - rule_name: price_positive
        rule_type: range
        column_name: unit_price
        rule_expression: "unit_price > 0"
        threshold_pct: 100.0
        fail_on_breach: true
