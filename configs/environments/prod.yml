# =============================================================================
# Production Environment Configuration
# Dynamic Databricks Ingestion Framework
# =============================================================================
#
# PURPOSE:
#   Environment-specific variable overrides for the PRODUCTION environment.
#   Production configuration uses stricter settings: INFO logging, DQ
#   enforcement enabled, and higher file-processing limits.
#
# IMPORTANT:
#   - Replace ALL <PLACEHOLDER_*> values before deploying.
#   - Never commit real workspace URLs, S3 bucket names, or secret scope names.
#   - Credentials are NEVER stored here — use Databricks secret scopes.
#   - Changes to this file require code review and change management approval.
# =============================================================================

environment: prod

# -----------------------------------------------------------------------------
# Unity Catalog
# -----------------------------------------------------------------------------
unity_catalog:
  catalog_name: prod_catalog
  metadata_schema: ingestion_metadata

  volumes:
    base_path: /Volumes/prod_catalog/ingestion_metadata/autoloader_volume
    schemas_path: /Volumes/prod_catalog/ingestion_metadata/autoloader_volume/schemas
    checkpoints_path: /Volumes/prod_catalog/ingestion_metadata/autoloader_volume/checkpoints

  bronze_schema_suffix: bronze
  silver_schema_suffix: silver
  gold_schema_suffix: gold

# -----------------------------------------------------------------------------
# AWS S3 Source Storage
# -----------------------------------------------------------------------------
s3:
  source_bucket: <PLACEHOLDER_PROD_S3_BUCKET_NAME>
  source_base_path: raw/
  external_location: <PLACEHOLDER_PROD_EXTERNAL_LOCATION_NAME>
  region: <PLACEHOLDER_AWS_REGION>

# -----------------------------------------------------------------------------
# Databricks Workspace
# -----------------------------------------------------------------------------
databricks:
  workspace_host: <PLACEHOLDER_PROD_WORKSPACE_HOST>
  cluster_policy: <PLACEHOLDER_PROD_CLUSTER_POLICY_NAME>

# -----------------------------------------------------------------------------
# Ingestion Engine Settings
# -----------------------------------------------------------------------------
ingestion:
  default_trigger: AvailableNow
  max_files_per_trigger: 10000        # Higher limit for production volumes
  schema_evolution_mode: addNewColumns
  rescue_data_column: true
  log_level: INFO                     # INFO in production — avoid DEBUG verbosity

# -----------------------------------------------------------------------------
# Secret Scopes
# -----------------------------------------------------------------------------
secrets:
  api_credentials_scope: api-secrets-prod
  databricks_scope: databricks-secrets-prod

# -----------------------------------------------------------------------------
# Data Quality Settings
# -----------------------------------------------------------------------------
data_quality:
  # In production: strictly honour per-rule fail_on_breach settings
  fail_on_breach_override: null       # null = use per-rule setting from dq_sla_config
  quarantine_schema: prod_catalog.ingestion_metadata
  quarantine_table_suffix: _quarantine

# -----------------------------------------------------------------------------
# Notification Settings
# -----------------------------------------------------------------------------
notifications:
  enabled: true
  # Production alerts go to the on-call data engineering team
  # email_recipients: ["<PLACEHOLDER_ONCALL_EMAIL>"]
  # slack_webhook_scope: monitoring-secrets-prod
  # slack_webhook_key: prod-alerts-webhook
  # pagerduty_scope: monitoring-secrets-prod
  # pagerduty_key: prod-pagerduty-key     # TODO: Enable for high-criticality SLA breaches
