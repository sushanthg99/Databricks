# =============================================================================
# GitHub Actions — Auto Deploy to Databricks
# Dynamic Databricks Ingestion Framework
# =============================================================================
#
# SECRETS REQUIRED (GitHub → Settings → Secrets → Actions):
#   DATABRICKS_HOST       → https://dbc-15fc2096-517b.cloud.databricks.com
#   DATABRICKS_TOKEN      → dapi...
#   DATABRICKS_USER_EMAIL → sushanth.gangadhara@blumetra.com
# =============================================================================

name: Deploy to Databricks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: dev
        type: choice
        options: [ dev, uat, prod ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: Validate
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        # Authenticated download (GITHUB_TOKEN) with retries - anonymous downloads were
        # being rejected (curl exit 22) for the second job in a run.
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: "1.23.0"
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/databricks-cli"
          mkdir -p "$dir"
          file="databricks_cli_${CLI_VERSION}_linux_amd64.zip"
          for attempt in 1 2 3; do
            if gh release download "v${CLI_VERSION}" -R databricks/cli -p "$file" -D "$dir" --clobber; then break; fi
            if [ "$attempt" = "3" ]; then echo "CLI download failed after 3 attempts"; exit 1; fi
            sleep $((attempt * 10))
          done
          unzip -q -o "$dir/$file" -d "$dir"
          chmod +x "$dir/databricks"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/databricks" version

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target dev

  # ---------------------------------------------------------------------------
  # JOB 2: Deploy + Sync Repos UI
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy + Sync Repos UI
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        # Authenticated download (GITHUB_TOKEN) with retries - anonymous downloads were
        # being rejected (curl exit 22) for the second job in a run.
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: "1.23.0"
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/databricks-cli"
          mkdir -p "$dir"
          file="databricks_cli_${CLI_VERSION}_linux_amd64.zip"
          for attempt in 1 2 3; do
            if gh release download "v${CLI_VERSION}" -R databricks/cli -p "$file" -D "$dir" --clobber; then break; fi
            if [ "$attempt" = "3" ]; then echo "CLI download failed after 3 attempts"; exit 1; fi
            sleep $((attempt * 10))
          done
          unzip -q -o "$dir/$file" -d "$dir"
          chmod +x "$dir/databricks"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/databricks" version

      - name: Set target
        id: target
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.target }}" >> $GITHUB_OUTPUT
          else
            echo "target=dev" >> $GITHUB_OUTPUT
          fi

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Deploying to: ${{ steps.target.outputs.target }}"
          databricks bundle deploy --target ${{ steps.target.outputs.target }}

      - name: Sync Databricks Repos UI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          REPO_PATH_EXPECTED: /Repos/${{ secrets.DATABRICKS_USER_EMAIL }}/Databricks
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          echo "Commit being synced : ${GITHUB_SHA}"
          echo "Expected repo path  : ${REPO_PATH_EXPECTED}"
          echo "Token belongs to    : $(databricks current-user me --output json | python3 -c 'import sys,json; print(json.load(sys.stdin).get("userName"))')"

          databricks repos list --output json > repos.json
          [ -s repos.json ] || echo '[]' > repos.json
          echo "Repos visible to this token:"
          python3 - <<'PY'
          import json
          for r in json.load(open("repos.json")) or []:
              print("  id=%s path=%s url=%s branch=%s head=%s" % (
                  r.get("id"), r.get("path"), r.get("url"), r.get("branch"), (r.get("head_commit_id") or "")[:7]))
          PY

          # match by GitHub URL (not by exact path) so a differently named/located repo is still found
          python3 - <<'PY' > matches.txt
          import json, os
          norm = lambda u: (u or "").lower().rstrip("/").removesuffix(".git")
          want = norm(os.environ["REPO_URL"])
          for r in json.load(open("repos.json")) or []:
              if norm(r.get("url")) == want:
                  print(r["id"], r.get("path"))
          PY

          if [ -s matches.txt ]; then
            while read -r id path; do
              echo "Updating repo $id at $path to main..."
              databricks repos update "$id" --branch main --output json | python3 -c 'import sys,json; r=json.load(sys.stdin); print("  now at branch=%s head=%s" % (r.get("branch"), (r.get("head_commit_id") or "")[:7]))'
            done < matches.txt
          else
            echo "No repo with URL ${REPO_URL} visible to this token - creating ${REPO_PATH_EXPECTED}"
            databricks repos create "${REPO_URL}" gitHub --path "${REPO_PATH_EXPECTED}"
          fi

      - name: Summary
        run: |
          echo "### ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Target | ${{ steps.target.outputs.target }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
