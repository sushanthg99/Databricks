# =============================================================================
# GitHub Actions — Auto Deploy to Databricks
# Dynamic Databricks Ingestion Framework
# =============================================================================
#
# TRIGGERS:
#   - Push to main branch       → deploys bundle + syncs Repos UI
#   - Pull request to main      → validates bundle only (no deploy)
#   - Manual trigger            → deploy to any target (dev/uat/prod)
#
# SECRETS REQUIRED (set in GitHub → Settings → Secrets → Actions):
#   DATABRICKS_HOST             → https://dbc-15fc2096-517b.cloud.databricks.com
#   DATABRICKS_TOKEN            → your Databricks personal access token
#   DATABRICKS_REPO_ID          → 480168241926967  (Repos UI sync)
#
# =============================================================================

name: Deploy to Databricks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - uat
          - prod

# Cancel any in-progress run for the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: Validate (runs on every push and PR)
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate --target dev

  # ---------------------------------------------------------------------------
  # JOB 2: Deploy (runs only on push to main or manual trigger)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy Bundle + Sync Repo
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Set deployment target
        id: target
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.target }}" >> $GITHUB_OUTPUT
          else
            echo "target=dev" >> $GITHUB_OUTPUT
          fi

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Deploying to target: ${{ steps.target.outputs.target }}"
          databricks bundle deploy --target ${{ steps.target.outputs.target }}

      - name: Sync Databricks Repo UI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Syncing Repos UI..."
          # Update the existing repo if it exists
          databricks repos update ${{ secrets.DATABRICKS_REPO_ID }} \
            --branch main || \
          # If update fails (repo deleted), re-create it
          databricks repos create \
            https://github.com/${{ github.repository }}.git \
            gitHub \
            --path "/Repos/${{ secrets.DATABRICKS_USER_EMAIL }}/Databricks"

      - name: Print deployment summary
        run: |
          echo "========================================"
          echo "  DEPLOYMENT COMPLETE"
          echo "========================================"
          echo "  Repo     : ${{ github.repository }}"
          echo "  Branch   : ${{ github.ref_name }}"
          echo "  Commit   : ${{ github.sha }}"
          echo "  Target   : ${{ steps.target.outputs.target }}"
          echo "  Triggered: ${{ github.event_name }}"
          echo "========================================"
