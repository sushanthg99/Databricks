# =============================================================================
# GitHub Actions — Auto Deploy to Databricks
# Dynamic Databricks Ingestion Framework
# =============================================================================
#
# SECRETS REQUIRED (GitHub → Settings → Secrets → Actions):
#   DATABRICKS_HOST       → https://dbc-15fc2096-517b.cloud.databricks.com
#   DATABRICKS_TOKEN      → dapi...
#   DATABRICKS_USER_EMAIL → sushanth.gangadhara@blumetra.com
# =============================================================================

name: Deploy to Databricks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: dev
        type: choice
        options: [ dev, uat, prod ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: Validate
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        id: cli1
        continue-on-error: true
        uses: databricks/setup-cli@main

      - name: Install Databricks CLI (retry)
        if: steps.cli1.outcome == 'failure'
        uses: databricks/setup-cli@main

      - name: Validate bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target dev

  # ---------------------------------------------------------------------------
  # JOB 2: Deploy + Sync Repos UI
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy + Sync Repos UI
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        id: cli1
        continue-on-error: true
        uses: databricks/setup-cli@main

      - name: Install Databricks CLI (retry)
        if: steps.cli1.outcome == 'failure'
        uses: databricks/setup-cli@main

      - name: Set target
        id: target
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.target }}" >> $GITHUB_OUTPUT
          else
            echo "target=dev" >> $GITHUB_OUTPUT
          fi

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "Deploying to: ${{ steps.target.outputs.target }}"
          databricks bundle deploy --target ${{ steps.target.outputs.target }}

      - name: Sync Databricks Repos UI
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          REPO_PATH="/Repos/${{ secrets.DATABRICKS_USER_EMAIL }}/Databricks"
          REPO_URL="https://github.com/${{ github.repository }}.git"

          echo "Syncing Repos UI at: $REPO_PATH"

          # Find existing repo ID
          REPO_ID=$(databricks repos list --output json 2>/dev/null | \
            python3 -c "
          import sys, json
          try:
              repos = json.load(sys.stdin)
              for r in repos:
                  if r.get('path') == '$REPO_PATH':
                      print(r['id'])
                      break
          except:
              pass
          " 2>/dev/null || echo "")

          if [ -n "$REPO_ID" ]; then
            echo "Found repo ID: $REPO_ID — updating to latest main..."
            # Force update — discards any local changes in the Databricks Repo
            databricks repos update "$REPO_ID" --branch main && \
              echo "✅ Repos UI updated successfully" || \
            {
              echo "Update failed (conflict) — re-creating repo..."
              databricks repos delete "$REPO_ID" || true
              sleep 2
              databricks repos create "$REPO_URL" gitHub --path "$REPO_PATH"
              echo "✅ Repos UI re-created successfully"
            }
          else
            echo "No existing repo found — creating..."
            databricks repos create "$REPO_URL" gitHub --path "$REPO_PATH"
            echo "✅ Repos UI created successfully"
          fi

      - name: Summary
        run: |
          echo "### ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Target | ${{ steps.target.outputs.target }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
