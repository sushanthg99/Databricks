# =============================================================================
# Databricks Asset Bundle (DAB) Configuration
# Dynamic Databricks Ingestion Framework
# =============================================================================
#
# USAGE:
#   Deploy to dev:  databricks bundle deploy --target dev
#   Deploy to uat:  databricks bundle deploy --target uat
#   Deploy to prod: databricks bundle deploy --target prod
#
#   Run a job:      databricks bundle run bronze_ingestion_job --target dev
#
# IMPORTANT:
#   - Replace all <PLACEHOLDER_*> values before deploying.
#   - Never store workspace URLs, tokens, or credentials in this file.
#   - Use Databricks secrets or environment variables for sensitive values.
#   - Workspace host and token are resolved from ~/.databrickscfg or
#     the DATABRICKS_HOST / DATABRICKS_TOKEN environment variables.
# =============================================================================

bundle:
  name: dynamic-databricks-ingestion

# -----------------------------------------------------------------------------
# Variables — override per target
# -----------------------------------------------------------------------------
variables:
  catalog_name:
    description: "Unity Catalog catalog name for this environment"
    default: "dev_catalog"

  metadata_schema:
    description: "Schema (database) name where metadata tables live"
    default: "ingestion_metadata"

  bronze_schema_prefix:
    description: "Prefix for Bronze Delta schemas (e.g. ecommerce_bronze)"
    default: "bronze"

  environment:
    description: "Target environment name — passed to notebooks at runtime"
    default: "dev"

  s3_source_bucket:
    description: "Source S3 bucket name for this environment"
    default: "<PLACEHOLDER_DEV_S3_BUCKET_NAME>"

  log_level:
    description: "Logging verbosity: DEBUG (dev) | INFO (uat/prod)"
    default: "DEBUG"

# -----------------------------------------------------------------------------
# Workspace sync — files deployed to workspace
# -----------------------------------------------------------------------------
workspace:
  root_path: ~/.bundle/${bundle.name}/${bundle.target}

  # Files to sync to the workspace
  file_path: ${workspace.root_path}/files

# -----------------------------------------------------------------------------
# Artifact / resource inclusions
# -----------------------------------------------------------------------------
include:
  - resources/*.yml

# Sync paths — only include project source, exclude dev artifacts
sync:
  include:
    - ingestion_framework/**
    - src/**
    - configs/**
    - notebooks/**
    - sql/**
    - docs/**
  exclude:
    - "**/__pycache__/**"
    - "**/*.pyc"
    - ".venv/**"
    - "tests/**"
    - ".kiro/**"

# -----------------------------------------------------------------------------
# Deployment Targets
# -----------------------------------------------------------------------------
targets:

  # --- Development ---
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-15fc2096-517b.cloud.databricks.com
    variables:
      environment: dev
      catalog_name: dev_catalog
      metadata_schema: ingestion_metadata
      bronze_schema_prefix: bronze
      s3_source_bucket: <PLACEHOLDER_DEV_S3_BUCKET_NAME>
      log_level: DEBUG

  # --- User Acceptance Testing ---
  uat:
    mode: staging
    workspace:
      host: <PLACEHOLDER_UAT_WORKSPACE_HOST>
    variables:
      environment: uat
      catalog_name: uat_catalog
      metadata_schema: ingestion_metadata
      bronze_schema_prefix: bronze
      s3_source_bucket: <PLACEHOLDER_UAT_S3_BUCKET_NAME>
      log_level: INFO

  # --- Production ---
  prod:
    mode: production
    workspace:
      host: <PLACEHOLDER_PROD_WORKSPACE_HOST>
    variables:
      environment: prod
      catalog_name: prod_catalog
      metadata_schema: ingestion_metadata
      bronze_schema_prefix: bronze
      s3_source_bucket: <PLACEHOLDER_PROD_S3_BUCKET_NAME>
      log_level: INFO
