# =============================================================================
# Orion Planning Financial pipeline — multi-task Workflow
#   stage_landing -> intake -> bronze -> silver -> security -> gold
# Deploy: databricks bundle deploy --target dev
# Run:    databricks bundle run plan_fin_job --target dev
#
# Production trigger: uncomment `trigger.file_arrival` and point `url` at the
# landing volume folder so a new run starts when the extract drops its files.
# (The extract must write _READY_<run>.json LAST; intake rejects partial runs.)
# =============================================================================

resources:
  jobs:
    plan_fin_job:
      name: "[${bundle.target}] Orion Planning Financial Pipeline"
      max_concurrent_runs: 1
      timeout_seconds: 7200

      parameters:
        - name: run_id
          default: RUN001
        - name: catalog_name
          default: ${var.catalog_name}
        - name: metadata_schema
          default: ${var.metadata_schema}
        - name: stage_from_repo
          default: "false"         # "true" copies demo data from the repo (demo/plan_mock_data) into the volume
        - name: log_level
          default: ${var.log_level}

      # trigger:
      #   pause_status: UNPAUSED
      #   file_arrival:
      #     url: /Volumes/<catalog>/plan_landing/landing/

      tasks:
        - task_key: stage_landing
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/plan_fin_pipeline_notebook
            base_parameters:
              stage: stage_landing
              run_id: "{{job.parameters.run_id}}"
              catalog_name: "{{job.parameters.catalog_name}}"
              metadata_schema: "{{job.parameters.metadata_schema}}"
              stage_from_repo: "{{job.parameters.stage_from_repo}}"
              log_level: "{{job.parameters.log_level}}"

        - task_key: intake
          depends_on:
            - task_key: stage_landing
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/plan_fin_pipeline_notebook
            base_parameters:
              stage: intake
              run_id: "{{job.parameters.run_id}}"
              catalog_name: "{{job.parameters.catalog_name}}"
              metadata_schema: "{{job.parameters.metadata_schema}}"
              stage_from_repo: "{{job.parameters.stage_from_repo}}"
              log_level: "{{job.parameters.log_level}}"

        - task_key: bronze
          depends_on:
            - task_key: intake
          max_retries: 1
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/plan_fin_pipeline_notebook
            base_parameters:
              stage: bronze
              run_id: "{{job.parameters.run_id}}"
              catalog_name: "{{job.parameters.catalog_name}}"
              metadata_schema: "{{job.parameters.metadata_schema}}"
              stage_from_repo: "{{job.parameters.stage_from_repo}}"
              log_level: "{{job.parameters.log_level}}"

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/plan_fin_pipeline_notebook
            base_parameters:
              stage: silver
              run_id: "{{job.parameters.run_id}}"
              catalog_name: "{{job.parameters.catalog_name}}"
              metadata_schema: "{{job.parameters.metadata_schema}}"
              stage_from_repo: "{{job.parameters.stage_from_repo}}"
              log_level: "{{job.parameters.log_level}}"

        - task_key: security
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/plan_fin_pipeline_notebook
            base_parameters:
              stage: security
              run_id: "{{job.parameters.run_id}}"
              catalog_name: "{{job.parameters.catalog_name}}"
              metadata_schema: "{{job.parameters.metadata_schema}}"
              stage_from_repo: "{{job.parameters.stage_from_repo}}"
              log_level: "{{job.parameters.log_level}}"

        - task_key: gold
          depends_on:
            - task_key: security
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/plan_fin_pipeline_notebook
            base_parameters:
              stage: gold
              run_id: "{{job.parameters.run_id}}"
              catalog_name: "{{job.parameters.catalog_name}}"
              metadata_schema: "{{job.parameters.metadata_schema}}"
              stage_from_repo: "{{job.parameters.stage_from_repo}}"
              log_level: "{{job.parameters.log_level}}"
